name: Update publications from PolyPublie

on:
  schedule:
    - cron: "17 9 * * *"     # every day at 09:17 UTC
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch publications
        run: python scripts/update_publications.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain publications.json)" ]; then
            git config user.name  "publications-bot"
            git config user.email "actions@users.noreply.github.com"
            git add publications.json
            git commit -m "Update publications from PolyPublie"
            git push
          else
            echo "No change."
          fi
